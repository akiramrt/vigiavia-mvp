# Stack local do VigiaVia.
#   docker compose up -d --build                         -> só a API (http://localhost:8000)
#   docker compose --profile observabilidade up -d       -> + Prometheus (9090) e Grafana (3000)
# Segredos vêm do arquivo .env (fora do git; modelo em .env.example). Painéis de administração
# (Prometheus/Grafana) ficam presos a 127.0.0.1: nunca expostos na rede.
name: vigiavia

services:
  api:
    build: .
    image: vigiavia-mvp:local
    ports: ["8000:8000"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN no .env}
      VIGIAVIA_SEMEAR_DEMO: "true"
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["dados:/dados"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observabilidade"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./observabilidade/prometheus:/etc/prometheus:ro
      - ./observabilidade/segredos:/etc/segredos:ro   # fora do bind mount somente leitura
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observabilidade"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?defina GRAFANA_SENHA no .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vigiavia-sinais-de-ouro.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  dados: {}
  prometheus: {}
  grafana: {}
