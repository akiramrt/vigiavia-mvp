# Prometheus do VigiaVia: coleta a API local (compose) e a API publicada no Azure (HTTPS).
# O token do /metrics é lido de observabilidade/segredos/metrics_token (fora do git).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Caminhos RELATIVOS ao diretório deste arquivo: valem no Docker (/etc/prometheus) e no Prometheus nativo.
rule_files:
  - alertas.yml

scrape_configs:
  - job_name: vigiavia-azure
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: [alvos_azure.json]
    authorization:
      type: Bearer
      credentials_file: ../segredos/metrics_token

  - job_name: vigiavia-local
    static_configs:
      - targets: ["api:8000"]
        labels: {ambiente: local}
    authorization:
      type: Bearer
      credentials_file: ../segredos/metrics_token
