# Prometheus do VigiaVia: coleta a API local (compose) e a API publicada no Azure (HTTPS).
# O token do /metrics é lido de arquivo montado (observabilidade/segredos/, fora do git).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: vigiavia-azure
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/alvos_azure.json]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/segredos/metrics_token

  - job_name: vigiavia-local
    static_configs:
      - targets: ["api:8000"]
        labels: {ambiente: local}
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/segredos/metrics_token
