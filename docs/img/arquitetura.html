<html lang="pt-BR"><head><meta charset="utf-8"><title>Arquitetura VigiaVia — produção</title>
<style>
  html, body { margin: 0; background: #fff; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  .t { font-size: 14px; fill: #13202b; } .tb { font-size: 15px; font-weight: 700; fill: #13202b; }
  .tt { font-size: 12.5px; fill: #45525e; } .h { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #6b7783; }
  .w { fill: #fff; }

<body>
<svg width="1700" height="900" viewBox="0 0 1700 900" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker></defs>
  <rect width="1700" height="900" fill="#fff"/>
  <text x="36" y="42" style="font-size:26px;font-weight:800;fill:#13202b">VigiaVia — arquitetura de produção (DevSecOps + Azure)</text>
  <text x="36" y="68" class="tt">Nada é publicado clicando em botão: código → portões de segurança → imagem aprovada → infraestrutura criada por Terraform → observabilidade.</text>

  <!-- coluna 1: GitHub -->
  <text x="36" y="108" class="h">GITHUB (REPOSITÓRIO PÚBLICO + ACTIONS)</text>
  <rect x="36" y="120" width="500" height="690" rx="16" fill="#f6f8fa" stroke="#c9d2db"/>
  <rect x="56" y="140" width="460" height="54" rx="10" fill="#13202b"/><text x="74" y="173" class="tb w" style="fill:#fff">git push (qualquer branch)  ·  pull request</text>
  <g>
    <rect x="56" y="214" width="146" height="70" rx="10" fill="#fff" stroke="#d0021b" stroke-width="2"/><text x="70" y="242" class="tb">Gitleaks</text><text x="70" y="264" class="tt">segredos vazados</text>
    <rect x="213" y="214" width="146" height="70" rx="10" fill="#fff" stroke="#d0021b" stroke-width="2"/><text x="227" y="242" class="tb">Semgrep</text><text x="227" y="264" class="tt">SAST (py, js, tf)</text>
    <rect x="370" y="214" width="146" height="70" rx="10" fill="#fff" stroke="#2a6fdb" stroke-width="2"/><text x="384" y="242" class="tb">pytest</text><text x="384" y="264" class="tt">contrato da API</text>
    <rect x="56" y="300" width="460" height="54" rx="10" fill="#fff" stroke="#2a6fdb" stroke-width="2"/><text x="74" y="333" class="tb">docker compose: API + Prometheus + Grafana no ar</text>
    <rect x="56" y="370" width="460" height="54" rx="10" fill="#fff" stroke="#d0021b" stroke-width="2"/><text x="74" y="403" class="tb">Trivy config: Dockerfile e Terraform (HIGH/CRITICAL barram)</text>
    <rect x="56" y="440" width="460" height="54" rx="10" fill="#fff" stroke="#c9d2db"/><text x="74" y="473" class="tb">docker build (multi-stage, usuário não root, sem segredos)</text>
    <rect x="56" y="510" width="460" height="54" rx="10" fill="#fff" stroke="#d0021b" stroke-width="2"/><text x="74" y="543" class="tb">Trivy imagem (SO + bibliotecas) + SBOM CycloneDX</text>
    <rect x="56" y="580" width="460" height="64" rx="10" fill="#fff8e8" stroke="#f5a623" stroke-width="2"/><text x="74" y="607" class="tb">só main: login OIDC (token de curta duração)</text><text x="74" y="629" class="tt">GitHub Secrets guardam só identificadores — nenhuma senha de nuvem</text>
    <rect x="56" y="660" width="460" height="54" rx="10" fill="#fff8e8" stroke="#f5a623" stroke-width="2"/><text x="74" y="693" class="tb">push no ACR → nova revisão no Container Apps</text>
    <rect x="56" y="730" width="460" height="54" rx="10" fill="#f1fbf5" stroke="#2f9e5b" stroke-width="2"/><text x="74" y="763" class="tb">smoke test HTTPS /health → ambiente "producao"</text>
  </g>
  <path d="M286 194 V 212" stroke="#4a5866" stroke-width="2" marker-end="url(#s)"/>
  <path d="M286 284 V 298" stroke="#4a5866" stroke-width="2" marker-end="url(#s)"/>

  <path d="M286 564 V 578" stroke="#4a5866" stroke-width="2" marker-end="url(#s)"/>
  <path d="M286 644 V 658" stroke="#4a5866" stroke-width="2" marker-end="url(#s)"/>
  <path d="M286 714 V 728" stroke="#4a5866" stroke-width="2" marker-end="url(#s)"/>

  <!-- coluna 2: Azure -->
  <text x="586" y="108" class="h">AZURE — BRAZIL SOUTH (CRIADO POR TERRAFORM)</text>
  <rect x="586" y="120" width="620" height="690" rx="16" fill="#eef4ff" stroke="#2a6fdb" stroke-dasharray="7 5"/>
  <rect x="606" y="140" width="280" height="88" rx="10" fill="#fff" stroke="#c9d2db"/><text x="622" y="168" class="tb">Entra ID</text><text x="622" y="190" class="tt">identidade federada do GitHub</text><text x="622" y="208" class="tt">(só a main; AcrPush + Contributor no RG)</text>
  <rect x="906" y="140" width="280" height="88" rx="10" fill="#fff" stroke="#c9d2db"/><text x="922" y="168" class="tb">Container Registry (Basic)</text><text x="922" y="190" class="tt">privado, sem usuário admin</text><text x="922" y="208" class="tt">pull por identidade gerenciada</text>
  <rect x="606" y="252" width="580" height="300" rx="12" fill="#fff" stroke="#2a6fdb" stroke-width="2"/>
  <text x="622" y="280" class="tb">Container Apps Environment → Container App "ca-vigiavia-prod"</text>
  <text x="622" y="306" class="t">• ingress gerenciado: somente HTTPS 443 (TLS), HTTP inseguro desligado</text>
  <text x="622" y="330" class="t">• nenhuma porta administrativa (SSH/RDP) — operação pelo plano de controle</text>
  <text x="622" y="354" class="t">• 1 réplica: 0,5 vCPU / 1 GiB, probes de liveness e readiness em /health</text>
  <text x="622" y="378" class="t">• segredo METRICS_TOKEN injetado em tempo de execução</text>
  <text x="622" y="402" class="t">• container: usuário 10001, imagem sem PyTorch (ONNX Runtime)</text>
  <rect x="622" y="420" width="548" height="116" rx="10" fill="#f1fbf5" stroke="#2f9e5b"/>
  <text x="638" y="446" class="tb">API FastAPI + interface web</text>
  <text x="638" y="470" class="tt">/v1/deteccoes (imagem processada em memória e descartada)</text>
  <text x="638" y="490" class="tt">/v1/relatos → SQLite no container: lat/lon + recorte da via (dado pessoal mínimo)</text>
  <text x="638" y="510" class="tt">/metrics (Bearer) · cabeçalhos CSP, HSTS, nosniff, frame-deny</text>
  <rect x="606" y="576" width="280" height="88" rx="10" fill="#fff" stroke="#c9d2db"/><text x="622" y="604" class="tb">Log Analytics</text><text x="622" y="626" class="tt">logs dos containers (30 dias,</text><text x="622" y="644" class="tt">teto de 1 GB/dia)</text>
  <rect x="906" y="576" width="280" height="88" rx="10" fill="#fff" stroke="#c9d2db"/><text x="922" y="604" class="tb">Storage — state do Terraform</text><text x="922" y="626" class="tt">RG separado, só Entra ID (sem chave),</text><text x="922" y="644" class="tt">TLS 1.2, versionamento</text>
  <rect x="606" y="688" width="580" height="100" rx="10" fill="#fff8e8" stroke="#f5a623"/>
  <text x="622" y="716" class="tb">Terraform (infra/)</text>
  <text x="622" y="740" class="tt">RG, Log Analytics, ACR, identidades, papéis, ambiente, Container App e OIDC.</text>
  <text x="622" y="760" class="tt">terraform.tfvars e backend.hcl ficam fora do git; state remoto no Storage.</text>

  <!-- coluna 3: usuários e observabilidade -->
  <text x="1256" y="108" class="h">CIDADÃO, ZELADORIA E OBSERVABILIDADE</text>
  <rect x="1256" y="120" width="408" height="150" rx="16" fill="#f1fbf5" stroke="#2f9e5b"/>
  <text x="1276" y="152" class="tb">Cidadão (celular) e zeladoria</text>
  <text x="1276" y="178" class="t">navegador → https://ca-vigiavia-prod…</text>
  <text x="1276" y="202" class="tt">câmera e GPS exigem HTTPS (contexto seguro)</text>
  <text x="1276" y="224" class="tt">modo "no aparelho": ONNX no navegador,</text>
  <text x="1276" y="244" class="tt">a imagem nem sai do celular</text>
  <rect x="1256" y="300" width="408" height="380" rx="16" fill="#f6f8fa" stroke="#c9d2db"/>
  <text x="1276" y="332" class="tb">Observabilidade (máquina da equipe)</text>
  <rect x="1276" y="350" width="368" height="100" rx="10" fill="#fff" stroke="#d0021b" stroke-width="2"/>
  <text x="1292" y="378" class="tb">Prometheus</text><text x="1292" y="400" class="tt">coleta HTTPS /metrics a cada 15 s (Bearer)</text><text x="1292" y="420" class="tt">regras: fora do ar, latência p95 > 1 s,</text><text x="1292" y="438" class="tt">erros 5xx > 5%, saturação</text>
  <rect x="1276" y="470" width="368" height="110" rx="10" fill="#fff" stroke="#f5a623" stroke-width="2"/>
  <text x="1292" y="498" class="tb">Grafana — 4 sinais de ouro</text><text x="1292" y="520" class="tt">latência · tráfego · erros · saturação</text><text x="1292" y="540" class="tt">+ inferência do modelo e negócio</text><text x="1292" y="560" class="tt">(dashboard versionado como código)</text>
  <text x="1276" y="612" class="tt">Mesma stack sobe com docker compose (perfil</text><text x="1276" y="632" class="tt">"observabilidade"), validada no pipeline.</text>
  <rect x="1256" y="700" width="408" height="110" rx="16" fill="#fff" stroke="#c9d2db"/>
  <text x="1276" y="730" class="tb">Dependabot</text><text x="1276" y="754" class="tt">pip, Docker, Actions e Terraform: correções</text><text x="1276" y="774" class="tt">chegam como PR e passam pelo mesmo pipeline</text>

  <text x="36" y="852" class="tt">Legenda: vermelho = portão de segurança que barra o pipeline · laranja = acesso à nuvem via OIDC · verde = caminho do cidadão · tracejado = coleta de métricas</text>
